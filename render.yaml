services:
  - type: web
    name: r-h-pilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: HOST
        value: 0.0.0.0
    disk:
      name: rhpilot-private-data
      mountPath: /app/data
      sizeGB: 1
