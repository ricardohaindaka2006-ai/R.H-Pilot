services:
  - type: web
    name: r-h-pilot-3
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node --max-old-space-size=320 server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: PUBLIC_URL
        value: https://r-h-pilot-3.onrender.com
      - key: ADMIN_EMAIL
        value: ricardohaindaka2006@gmail.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false

# Free only: no disk, database or paid worker is provisioned by this Blueprint.
# 512 MB is RAM, not a disk quota. Runtime state is capped at 8 MiB; private
# generated backups at 3 / 24 MiB / 7 days; all application data at 48 MiB.
# Set an operator-owned direct/session PostgreSQL DATABASE_URL privately for
# customer state and MT5 demo execution. No database is created automatically.
# Render Free Postgres expires after 30 days; local Free storage is ephemeral.
# See MT5-FREE-SETUP.md. Do not put broker, database or admin secrets here.
