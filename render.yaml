services:
  - type: web
    name: r-h-pilot-3
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: PUBLIC_URL
        value: https://r-h-pilot-3.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DERIV_APP_ID
        sync: false
      - key: DERIV_TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_SITE_VERIFICATION
        sync: false
      - key: BING_SITE_VERIFICATION
        sync: false

# IMPORTANT: the current Free plan has ephemeral local storage.
# Do not use it for persistent customer accounts, licences, or production
# trading state. Before a public paid launch, attach persistent storage on
# an eligible paid service or move the database to managed PostgreSQL.
