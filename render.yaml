services:
  - type: web
    name: r-h-pilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATA_DIR
        value: /app/data
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 10000
      - key: PUBLIC_URL
        value: https://r-h-pilot.onrender.com
    # The free plan has no persistent disk; DATA_DIR is ephemeral and the app
    # re-seeds config on boot. Move to a paid plan + disk before going live
    # with real client licences.
