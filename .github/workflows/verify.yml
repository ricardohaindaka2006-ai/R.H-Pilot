name: Verify R.H Pilot and Deriv

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked runtime dependency
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run engine and API tests
        run: npm test
      - name: Reproduce frozen synthetic diagnostics
        run: npm run validate:strategies -- --check
      - name: Benchmark Springboks signal path
        run: node scripts/benchmark-engine.js
      - name: Verify real Deriv API and XAUUSD tick
        run: node scripts/verify-deriv.js
      - name: Verify the live Render production deployment
        if: github.ref == 'refs/heads/main'
        env:
          DEPLOY_URL: https://r-h-pilot-3.onrender.com
          EXPECTED_DEPLOY_SHA: ${{ github.sha }}
        run: node scripts/verify-deployment.js
      - name: Publish production diagnostic
        if: always() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f production-diagnostic.json ]; then
            gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -f body="$(cat production-diagnostic.json)"
          fi
      - name: Publish Deriv diagnostic to the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f deriv-diagnostic.json ]; then
            gh pr comment "$PR_NUMBER" --body-file deriv-diagnostic.json
          fi
