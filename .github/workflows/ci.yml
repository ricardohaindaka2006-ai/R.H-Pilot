name: R.H PILOT CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Syntax and simulator tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run backend and simulator tests
        run: npm test
      - name: Reproduce synthetic strategy diagnostics (not live-market validation)
        run: npm run validate:strategies -- --check
      - name: Benchmark signal computation
        run: npm run benchmark:engine
